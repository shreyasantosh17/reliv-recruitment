<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reliv - Login</title>
  <style>
    :root{--bg:#0b0d12;--surface:#141822;--line:#232938;--text:#e6e9ef;--muted:#8a93a6;--brand:#5b8def;--brand2:#8e6cff;--red:#ff6b6b}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:40px;width:100%;max-width:380px;text-align:center;
      box-shadow:0 16px 50px rgba(0,0,0,.4)}
    .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));
      display:inline-grid;place-items:center;font-weight:800;font-size:24px;color:#fff;margin-bottom:16px;box-shadow:0 8px 24px rgba(91,141,239,.35)}
    h1{margin:0 0 4px;font-size:20px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
    input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font:inherit;outline:none;
      text-align:center;font-size:16px;letter-spacing:2px;transition:border-color .15s}
    input:focus{border-color:var(--brand)}
    input::placeholder{letter-spacing:normal;color:var(--muted)}
    button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:10px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700;font-size:14px;cursor:pointer;
      box-shadow:0 6px 18px rgba(91,141,239,.3);transition:filter .15s,transform .08s}
    button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)}
    .err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">R</div>
    <h1>Reliv Recruitment</h1>
    <p class="sub">Enter dashboard password</p>
    <form id="form">
      <input id="pwd" type="password" placeholder="Password" autofocus autocomplete="current-password">
      <button type="submit">Unlock</button>
    </form>
    <div class="err" id="err"></div>
  </div>
  <script>
    document.getElementById('form').onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const pwd = document.getElementById('pwd').value;
      try {
        const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd})});
        const d = await r.json();
        if (d.ok) { window.location.href = '/'; }
        else { err.textContent = d.error || 'Wrong password'; }
      } catch(ex) { err.textContent = 'Connection error'; }
    };
  </script>
</body>
</html>
